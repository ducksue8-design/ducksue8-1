<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0c1020">
<title>무지개 사다리타기</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#171e33;--muted:#9ba9c4;--text:#f4f7ff;--border:#2c3653;--accent:#8a7dff;--shadow:0 20px 60px #03081860}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;font-family:Pretendard,"Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(ellipse at 15% 4%,#3b296080,transparent 35%),radial-gradient(ellipse at 90% 23%,#144e6a66,transparent 30%),var(--bg)}
button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #c8bdff;outline-offset:3px}.shell{max-width:1140px;margin:0 auto;padding:32px 20px 64px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:26px}.eyebrow{letter-spacing:.24em;font-size:12px;font-weight:800;color:#b8b4ff}.top h1{font-size:clamp(30px,5vw,48px);letter-spacing:-.055em;margin:8px 0 8px}.top p{color:var(--muted);margin:0;line-height:1.6}.logo{font-size:34px;padding:9px 13px;border:1px solid #ffffff24;border-radius:17px;background:#ffffff10}.layout{display:grid;grid-template-columns:minmax(280px,330px) minmax(0,1fr);gap:20px;align-items:start}.panel{background:#151d31ed;border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow)}.control{padding:22px}.section-heading{display:flex;align-items:center;justify-content:space-between;gap:12px}.section-heading h2{font-size:18px;margin:0;letter-spacing:-.025em}.hint{font-size:12px;color:var(--muted);line-height:1.6;margin:8px 0 0}.counter{display:flex;align-items:center;justify-content:space-between;background:#0d1528;border:1px solid var(--border);padding:9px 10px 9px 14px;border-radius:14px;margin:16px 0 20px}.counter span{font-weight:700;font-size:14px}.stepper{display:flex;align-items:center;gap:13px}.stepper strong{min-width:20px;text-align:center}.mini{border:1px solid #46516e;border-radius:10px;background:#25304a;color:white;width:33px;height:33px;font-size:21px;line-height:1}.fields-title{font-size:13px;font-weight:800;color:#d5def7;margin:18px 0 9px}.field-list{display:grid;gap:8px}.input-row{display:flex;gap:9px;align-items:center}.index-dot{display:grid;place-items:center;width:25px;height:25px;border-radius:8px;color:#fff;font-size:12px;font-weight:800;flex-shrink:0;background:var(--dot)}.input-row input{width:100%;min-width:0;background:#0c1426;color:white;border:1px solid #35415d;border-radius:11px;padding:11px 12px;font-size:14px}.input-row input::placeholder{color:#71819f}.actions{display:grid;gap:9px;margin-top:22px}.primary,.secondary{width:100%;border:0;border-radius:13px;min-height:46px;font-weight:800;transition:transform .12s,filter .12s,background .12s}.primary{background:linear-gradient(100deg,#7867ff,#bc6cf8,#f17aa7);color:#fff}.secondary{background:#283450;color:#e8edff;border:1px solid #3c4b70}.primary:hover,.secondary:hover,.mini:hover{filter:brightness(1.12)}.primary:active,.secondary:active,.mini:active{transform:scale(.98)}.primary:disabled,.secondary:disabled{opacity:.45;cursor:not-allowed}.aside-foot{color:#8494b6;font-size:12px;line-height:1.65;margin:17px 0 0}.game{padding:22px;min-height:550px}.game-header{display:flex;justify-content:space-between;align-items:start;gap:10px;margin-bottom:14px}.game-header h2{margin:0 0 4px;font-size:20px}.game-header p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}.status{display:flex;align-items:center;gap:7px;border-radius:99px;background:#26324b;border:1px solid #3c4d6d;color:#bed0f5;padding:8px 11px;font-size:12px;white-space:nowrap}.status-dot{width:7px;height:7px;border-radius:50%;background:#84e4c0}.board-scroll{overflow-x:auto;overscroll-behavior-inline:contain;padding:4px 0 6px}.board{position:relative;min-width:460px;user-select:none}.labels{position:relative;height:55px}.label-chip{position:absolute;top:4px;transform:translateX(-50%);min-width:66px;max-width:112px;padding:8px 7px;border:1px solid #46536f;border-radius:11px;text-align:center;background:#27334e;color:#f2f5ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;font-weight:700;transition:background .2s,border-color .2s,box-shadow .2s}.start-label{cursor:pointer}.start-label:hover{background:#3a4764}.label-chip.active{background:#403a78;border-color:#aba1ff;box-shadow:0 0 0 3px #a99aff26}.label-chip.done{border-color:#7ce5c4}.canvas-wrap{position:relative;height:380px;background:linear-gradient(#141d33,#10192c);border:1px solid #2d3a59;border-radius:19px;overflow:hidden}.canvas-wrap svg{width:100%;height:100%;display:block;overflow:visible}.result-label{top:10px;background:#1f2b43;border-color:#3b4b6b}.result-label.revealed{background:#174a43;border-color:#5be6ba;color:#c9ffeb}.bottom-labels{height:62px}.legend{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;color:#aebbd4;font-size:12px}.legend strong{color:#f4f7ff}.rainbow{display:flex;gap:4px}.rainbow i{width:10px;height:10px;border-radius:50%;background:var(--c)}.result-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:9px;margin-top:18px}.result-item{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#202b45;border:1px solid #35415e;border-radius:12px;padding:12px;font-size:13px}.result-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.result-item b{color:#c6b9ff;white-space:nowrap}.result-heading{margin:20px 0 0;font-size:15px}.empty{margin:10px 0 0;color:#8e9cba;font-size:13px}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,15px);background:#e9eeff;color:#17223d;padding:12px 17px;border-radius:12px;box-shadow:0 15px 40px #0008;font-weight:700;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:5}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:800px){.layout{grid-template-columns:1fr}.game{min-height:0}.shell{padding:24px 14px 48px}.top{margin-bottom:20px}.control,.game{padding:18px}.field-columns{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fields-title{margin-top:5px}.canvas-wrap{height:360px}}@media(max-width:520px){.field-columns{grid-template-columns:1fr;gap:0}.top h1{font-size:34px}.top p{font-size:13px}.game-header{flex-direction:column}.board{min-width:430px}.legend{align-items:start;flex-direction:column}.logo{font-size:25px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell">
<header class="top"><div><div class="eyebrow">PLAY · RANDOM · FUN</div><h1>🌈 사다리타기 게임</h1><p>이름과 결과를 입력하고, 운명의 사다리를 타보세요!</p></div><div class="logo" aria-hidden="true">🎲</div></header>
<main class="layout">
<section class="panel control" aria-labelledby="setup-title"><div class="section-heading"><h2 id="setup-title">⚙️ 게임 설정</h2></div><p class="hint">인원은 2~10명까지 설정할 수 있어요.</p><div class="counter"><span>참가 인원</span><div class="stepper"><button class="mini" id="minus" aria-label="인원 줄이기">−</button><strong id="count">5</strong><button class="mini" id="plus" aria-label="인원 늘리기">+</button></div></div><div class="field-columns"><div><div class="fields-title">🙋 참가자 이름</div><div id="names" class="field-list"></div></div><div><div class="fields-title">🎁 당첨 결과</div><div id="prizes" class="field-list"></div></div></div><div class="actions"><button class="primary" id="generate">🔀 새 사다리 만들기</button><button class="secondary" id="all">✨ 전체 결과 공개</button><button class="secondary" id="reset">↺ 초기화</button></div><p class="aside-foot">💡 상단의 참가자 이름을 누르면 해당 경로가 그려져요. 새 사다리를 만들 때마다 결과가 무작위로 달라집니다.</p></section>
<section class="panel game" aria-labelledby="board-title"><div class="game-header"><div><h2 id="board-title">게임 보드</h2><p id="board-description">시작할 참가자를 선택해 주세요.</p></div><div class="status"><span class="status-dot"></span><span id="status">준비 완료</span></div></div><div class="board-scroll"><div class="board" id="board"><div id="topLabels" class="labels"></div><div class="canvas-wrap"><svg id="ladder" role="img" aria-label="사다리 게임 경로" viewBox="0 0 700 380" preserveAspectRatio="none"></svg></div><div id="bottomLabels" class="labels bottom-labels"></div></div></div><div class="legend"><span>👆 <strong>참가자 이름</strong>을 눌러 출발하세요 · 아래 결과는 도착 시 공개됩니다.</span><span class="rainbow" aria-hidden="true"><i style="--c:#ff747c"></i><i style="--c:#ffb454"></i><i style="--c:#f4dc6b"></i><i style="--c:#66dab3"></i><i style="--c:#5aaeff"></i><i style="--c:#b38cff"></i></span></div><h3 class="result-heading">🏆 결과 확인</h3><div id="results" class="result-list" aria-live="polite"></div><p id="empty" class="empty">아직 공개된 결과가 없어요.</p></section>
</main>
</div><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const colors=['#ff747c','#ffb454','#f4dc6b','#66dab3','#5aaeff','#b38cff','#ef85d8','#69d6e5','#a5db6c','#ffa57e'];
const defaults=['김하늘','이서준','박지민','최유진','정도윤','한지우','윤서아','강민준','임수빈','조은우'];
const rewards=['🎉 당첨!','☕ 커피','🍀 꽝','🍰 디저트','🎁 선물','🍕 피자','⭐ 보너스','🍔 햄버거','🎬 영화','💖 행운'];
let n=5, names=defaults.slice(), prizes=rewards.slice(), rungs=[], revealed=new Map(), busy=false, runToken=0, seq=0;
const SVG_NS='http://www.w3.org/2000/svg', WIDTH=700,HEIGHT=380,TOP=24,BOTTOM=354,STEPS=15;
const x=i=>52+i*(WIDTH-104)/(n-1), y=k=>TOP+k*(BOTTOM-TOP)/STEPS;
function node(tag,attrs){const e=document.createElementNS(SVG_NS,tag);Object.entries(attrs||{}).forEach(([k,v])=>e.setAttribute(k,v));return e}
function addLine(parent,x1,y1,x2,y2,stroke,width=4,extra={}){let e=node('line',{x1,y1,x2,y2,stroke,'stroke-width':width,'stroke-linecap':'round',...extra});parent.appendChild(e);return e}
function notice(msg){$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(notice.timer);notice.timer=setTimeout(()=>$('toast').classList.remove('show'),2400)}
function saveInputs(){document.querySelectorAll('[data-name]').forEach(el=>names[+el.dataset.name]=el.value);document.querySelectorAll('[data-prize]').forEach(el=>prizes[+el.dataset.prize]=el.value)}
function inputRow(target,i,value,kind){const r=document.createElement('div');r.className='input-row';const dot=document.createElement('span');dot.className='index-dot';dot.style.setProperty('--dot',colors[i]);dot.textContent=i+1;const inp=document.createElement('input');inp.type='text';inp.maxLength=24;inp.value=value;inp.dataset[kind]=i;inp.setAttribute('aria-label',(kind==='name'?'참가자':'결과')+' '+(i+1));inp.placeholder=kind==='name'?'참가자 '+(i+1):'결과 '+(i+1);inp.addEventListener('input',()=>{if(kind==='name')names[i]=inp.value;else prizes[i]=inp.value;refreshLabels();refreshResults()});r.append(dot,inp);target.appendChild(r)}
function renderFields(){$('count').textContent=n;$('minus').disabled=n<=2;$('plus').disabled=n>=10;$('names').replaceChildren();$('prizes').replaceChildren();for(let i=0;i<n;i++){inputRow($('names'),i,names[i],'name');inputRow($('prizes'),i,prizes[i],'prize')}}
function randomInt(max){if(globalThis.crypto&&crypto.getRandomValues){let a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%max}return Math.floor(Math.random()*max)}
function makeRungs(){let result=[],last=-2;for(let k=1;k<STEPS;k++){let row=[];let start=randomInt(2);for(let j=start;j<n-1;j+=2){if(randomInt(100)<67&&!(last===k-1&&randomInt(4)===0))row.push(j)}result.push({k,row});last=k}return result}
function draw(){const svg=$('ladder');svg.replaceChildren();const grad=node('defs');const fl=node('filter',{id:'glow',x:'-50%',y:'-50%',width:'200%',height:'200%'});fl.append(node('feGaussianBlur',{stdDeviation:'3',result:'blur'}));grad.append(fl);svg.append(grad);for(let j=0;j<n;j++){addLine(svg,x(j),TOP,x(j),BOTTOM,'#4d5a79',5);addLine(svg,x(j),TOP,x(j),BOTTOM,'#8997b2',1.6)}for(const {k,row} of rungs){for(const j of row){addLine(svg,x(j),y(k),x(j+1),y(k),'#8795af',5);addLine(svg,x(j),y(k),x(j+1),y(k),'#bdc9e0',1.4)}}for(let j=0;j<n;j++){svg.append(node('circle',{cx:x(j),cy:TOP,r:7,fill:colors[j],stroke:'#e4e9ff','stroke-width':2}));svg.append(node('circle',{cx:x(j),cy:BOTTOM,r:6,fill:'#18223b',stroke:'#7889a8','stroke-width':2}))}const g=node('g',{id:'paths'});svg.append(g)}
function route(start){let pos=start,points=[[x(pos),TOP]];for(let k=1;k<=STEPS;k++){points.push([x(pos),y(k)]);if(k<STEPS){let row=rungs[k-1].row;if(row.includes(pos)){pos++;points.push([x(pos),y(k)])}else if(row.includes(pos-1)){pos--;points.push([x(pos),y(k)])}}}return{end:pos,points}}
function pathData(points){return points.map((p,i)=>(i?'L':'M')+p[0].toFixed(2)+','+p[1].toFixed(2)).join(' ')}
function routeLength(points){let len=0;for(let i=1;i<points.length;i++){len+=Math.abs(points[i][0]-points[i-1][0])+Math.abs(points[i][1]-points[i-1][1])}return len}
function placeChip(parent,i,label,cls){let el=document.createElement(cls==='start-label'?'button':'div');el.className='label-chip '+cls;el.style.left=(x(i)/WIDTH*100)+'%';el.textContent=label;el.title=label;if(cls==='start-label'){el.type='button';el.addEventListener('click',()=>play(i));el.setAttribute('aria-label',label+'의 결과 확인')}parent.append(el);return el}
function refreshLabels(){const top=$('topLabels'),bottom=$('bottomLabels');top.replaceChildren();bottom.replaceChildren();for(let i=0;i<n;i++){const t=placeChip(top,i,names[i].trim()||'참가자 '+(i+1),'start-label');if(revealed.has(i)){t.classList.add('done');t.style.borderColor=colors[i]}const known=[...revealed].find(([p,e])=>e===i);const b=placeChip(bottom,i,known?prizes[i].trim()||'결과 '+(i+1):'❔','result-label');if(known)b.classList.add('revealed')}}
function refreshResults(){const el=$('results');el.replaceChildren();for(const [start,end] of revealed){const d=document.createElement('div');d.className='result-item';const a=document.createElement('span'),b=document.createElement('b');a.textContent=names[start].trim()||'참가자 '+(start+1);b.textContent=prizes[end].trim()||'결과 '+(end+1);d.append(a,b);el.append(d)}$('empty').hidden=revealed.size>0}
function status(msg){$('status').textContent=msg}
function lock(v){busy=v;$('generate').disabled=v;$('all').disabled=v;$('reset').disabled=v;$('minus').disabled=v||n<=2;$('plus').disabled=v||n>=10;document.querySelectorAll('#names input,#prizes input').forEach(e=>e.disabled=v)}
function drawKnown(start,end){const {points}=route(start),p=node('path',{d:pathData(points),fill:'none',stroke:colors[start],'stroke-width':7,'stroke-linecap':'round','stroke-linejoin':'round',opacity:'.95'});$('paths').append(p)}
async function play(start,instant=false){if(busy||revealed.has(start))return;if(!instant)lock(true);const {end,points}=route(start);let p=node('path',{d:pathData(points),fill:'none',stroke:colors[start],'stroke-width':7,'stroke-linecap':'round','stroke-linejoin':'round'});$('paths').append(p);const length=routeLength(points);p.style.strokeDasharray=length;p.style.strokeDashoffset=length;const startChip=$('topLabels').children[start];startChip.classList.add('active');status((names[start].trim()||'참가자 '+(start+1))+' 이동 중');if(!instant&&!(matchMedia('(prefers-reduced-motion: reduce)').matches)){await new Promise(resolve=>{const anim=p.animate([{strokeDashoffset:length},{strokeDashoffset:0}],{duration:Math.min(3400,1200+n*210),easing:'linear',fill:'forwards'});anim.onfinish=resolve;anim.oncancel=resolve});}p.style.strokeDashoffset='0';p.style.strokeDasharray='none';revealed.set(start,end);refreshLabels();refreshResults();$('topLabels').children[start].classList.add('active');status('결과 '+revealed.size+' / '+n+' 공개');if(!instant){lock(false);notice((names[start].trim()||'참가자 '+(start+1))+' → '+(prizes[end].trim()||'결과 '+(end+1)))}}
function generate(showToast=true){if(busy)return;saveInputs();rungs=makeRungs();revealed.clear();seq++;draw();refreshLabels();refreshResults();status('준비 완료');$('board-description').textContent='시작할 참가자를 선택해 주세요.';if(showToast)notice('새 사다리가 만들어졌어요!')}
function resizeCount(delta){if(busy)return;const next=Math.max(2,Math.min(10,n+delta));if(next===n)return;saveInputs();n=next;renderFields();generate(false)}
$('minus').addEventListener('click',()=>resizeCount(-1));$('plus').addEventListener('click',()=>resizeCount(1));$('generate').addEventListener('click',()=>generate());$('all').addEventListener('click',async()=>{if(busy)return;lock(true);status('전체 결과 공개 중');for(let i=0;i<n;i++)if(!revealed.has(i)){const{end}=route(i);drawKnown(i,end);revealed.set(i,end)}refreshLabels();refreshResults();status('전체 결과 공개 완료');lock(false);notice('모든 결과가 공개되었어요!')});$('reset').addEventListener('click',()=>{if(busy)return;n=5;names=defaults.slice();prizes=rewards.slice();renderFields();generate(false);notice('기본 설정으로 초기화했어요')});
renderFields();generate(false);
})();
</script>
</body>
</html>
